# Model routing — NVIDIA NIM hosted API.
# Primary: Nemotron Ultra 550B (most capable) for planning/review roles.
# Fast roles: minimax-m3.1-flash (DEV/OPS/EXPLORER/SUMMARIZER).
# Second fallback: mistral-7b-instruct (always-available lightweight option).
[llm]
default_provider = "nvidia"
default_model = "nvidia/nemotron-3-ultra-550b-a55b"
temperature = 0.0
request_timeout_seconds = 300.0
max_retries = 3
retry_base_seconds = 1.0
retry_max_seconds = 16.0
circuit_cooldown_seconds = 30.0
max_tokens = 320000
max_cost_usd = 0
max_wall_seconds = 1800.0
max_completion_tokens = 4096


[llm.roles.CTO]
provider = "nvidia"
model = "nvidia/nemotron-3-ultra-550b-a55b"
context_tokens = 320000
max_tool_output_tokens = 20000
fallback = [
  { provider = "nvidia", model = "minimaxai/minimax-m3.1-flash" },
  { provider = "nvidia", model = "mistralai/mistral-7b-instruct-v0.3" },
]

[llm.roles.DEV]
provider = "nvidia"
model = "minimaxai/minimax-m3.1-flash"
context_tokens = 320000
max_tool_output_tokens = 20000
fallback = [
  { provider = "nvidia", model = "nv-mistralai/mistral-nemo-12b-instruct" },
  { provider = "nvidia", model = "nvidia/nemotron-3-ultra-550b-a55b" },
]

[llm.roles.QA]
provider = "nvidia"
model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
context_tokens = 320000
max_tool_output_tokens = 15000
fallback = [
  { provider = "nvidia", model = "minimaxai/minimax-m3.1-flash" },
