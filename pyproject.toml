[build-system]
requires=["setuptools>=68", "wheel"]
build-backend="setuptools.backends.legacy:build"

[project]
name="aegis-os"
version="0.1.0"
description="AegisOS: An Autonomous AI Engineering Organization"
requires-python=">=3.11"
readme="README.md"

[tool.setuptools.packages.find]
where=["."]
include=["aegis_os*"]

[tool.pytest.ini_options]
testpaths=["tests"]
asyncio_mode="auto"
python_files=["test_*.py"]
python_classes=["Test*"]
python_functions=["test_*"]
log_cli=true
log_cli_level="INFO"
addopts="-v --tb=short"

[tool.ruff]
line-length=100
target-version="py311"
select=["E","F","W","I","N","UP"]
ignore=["E501"]

[tool.black]
line-length=100
target-version=["py311"]