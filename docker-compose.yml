services:
  aegis-mission-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-mission-control
    ports:
      - "8000:8000"
    volumes:
      - ./.aegis:/app/.aegis
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AEGIS_API_TOKEN=${AEGIS_API_TOKEN:-}
    restart: unless-stopped
    command: ["aegis", "server", "--host", "0.0.0.0", "--port", "8000", "--db-path", "/app/.aegis/checkpoints.db"]
